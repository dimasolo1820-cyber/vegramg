name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize Bubblewrap
      run: |
        echo "y" | bubblewrap init --manifest="https://dimasolo1820-cyber.github.io/vegramg/manifest.json" --directory=./android
        
    - name: Build APK
      run: |
        cd android
        bubblewrap build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Vegram-APK
        path: android/app-release-signed.apk
      
