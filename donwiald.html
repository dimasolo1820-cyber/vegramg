
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скачать Vegram</title>
<link rel="icon" href="icon.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(-45deg, #0e1621, #17212b, #1d3a57, #0e1621);
    background-size: 400% 400%; animation: gradientBG 15s ease infinite;
    color: #fff; padding: 20px; overflow: hidden;
  }

  @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .circle { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 6s ease-in-out infinite; }
  .circle1 { width: 300px; height: 300px; background: rgba(43, 82, 120, 0.6); top: -50px; left: -50px; }
  .circle2 { width: 250px; height: 250px; background: rgba(77, 205, 94, 0.3); bottom: -50px; right: -50px; animation-delay: 3s; }

  @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }

  .card {
    background: rgba(23, 33, 43, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px 30px;
    max-width: 420px; width: 100%; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    animation: fadeIn 1s ease-out;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .app-icon { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: floatIcon 4s ease-in-out infinite; }
  @keyframes floatIcon { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

  h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; background: linear-gradient(90deg, #4dcd5e, #2b5278); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
  .subtitle { font-size: 14px; color: #8a9aa9; margin-bottom: 30px; line-height: 1.5; }

  .features { text-align: left; margin-bottom: 30px; background: rgba(0, 0, 0, 0.2); padding: 15px 20px; border-radius: 16px; list-style: none; }
  .features li { margin-bottom: 10px; font-size: 14px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; }
  .features li:last-child { margin-bottom: 0; }
  .features li span { font-size: 18px; }

  /* Кнопки */
  .btn {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    width: 100%; padding: 18px; color: white; text-decoration: none; border-radius: 16px; 
    font-size: 16px; font-weight: 700; transition: 0.3s; border: none; cursor: pointer; margin-bottom: 15px;
  }

  .btn-android { background: linear-gradient(135deg, #2e7d32, #1b5e20); box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4); }
  .btn-android:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(46, 125, 50, 0.6); }

  .btn-web { background: linear-gradient(135deg, #2b5278, #1d3a57); box-shadow: 0 10px 20px rgba(43, 82, 120, 0.4); }
  .btn-web:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(43, 82, 120, 0.6); }

  .instruction { margin-top: 10px; font-size: 12px; color: #6c7883; line-height: 1.5; }
</style>
</head>
<body>

  <div class="circle circle1"></div>
  <div class="circle circle2"></div>

  <div class="card">
    <img src="icon.png" alt="Vegram" class="app-icon">
    
    <h1>Vegram</h1>
    <p class="subtitle">Твой личный мессенджер. Быстрый, безопасный и без лишнего шума.</p>
    
    <ul class="features"><li><span>⚡</span> Мгновенная доставка сообщений</li>
      <li><span>🔒</span> Личные чаты с контактами</li>
      <li><span>📱</span> Работает как приложение</li>
    </ul>
    
    <!-- Кнопка 1: Скачать APK для Android -->
    <a href="Vegram.apk" class="btn btn-android" download>
      🤖 Скачать для Android (APK)
    </a>
    
    <!-- Кнопка 2: Открыть веб-версию (текущий index.html) -->
    <a href="index.html" class="btn btn-web">
      🌐 Открыть в браузере (Web)
    </a>
    
    <div class="instruction">
      Для Android скачивай APK.<br>
      Для ПК или iOS используй веб-версию.
    </div>
  </div>

</body>
</html>
