
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vegram</title>

<!-- ПОДКЛЮЧЕНИЕ МАНИФЕСТА И ИКОНКИ (для сборки APK) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #0e1621; color: #fff; }
  
  #loginScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background: #17212b; z-index: 999; position: fixed; inset: 0; }
  #loginScreen h1 { font-size: 32px; color: #2b5278; margin-bottom: 20px; }
  #loginScreen input { width: 100%; max-width: 300px; padding: 15px; border-radius: 10px; border: 1px solid #2b3a4a; background: #242f3d; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; }
  #loginScreen button { width: 100%; max-width: 300px; padding: 15px; border-radius: 10px; border: none; background: #2b5278; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }

  .app { display: flex; height: 100%; width: 100%; position: relative; display: none; }
  .sidebar { width: 100%; height: 100%; display: flex; flex-direction: column; background: #17212b; position: absolute; inset: 0; transition: transform 0.25s ease; z-index: 2; }
  .app.chat-open .sidebar { transform: translateX(-100%); }
  
  .header { padding: 15px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; justify-content: space-between; }
  .header .name { font-size: 18px; font-weight: bold; }
  .logout-btn { background: none; border: none; color: #e74c3c; font-size: 14px; cursor: pointer; }
  
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .chat-item:active { background: #202b36; }
  .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #2b5278; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-info .name { font-size: 16px; font-weight: 600; }
  
  .chat-area { width: 100%; height: 100%; display: flex; flex-direction: column; background: #0e1621; position: absolute; inset: 0; transform: translateX(100%); transition: transform 0.25s ease; z-index: 3; }
  .app.chat-open .chat-area { transform: translateX(0); }
  
  .chat-header { padding: 10px 14px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .chat-header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn { background: transparent; border: none; color: #8a9aa9; font-size: 28px; cursor: pointer; padding: 0 8px; }
  .chat-header .avatar { width: 40px; height: 40px; font-size: 18px; }
  .chat-header .title { font-size: 16px; font-weight: 600; }
  .call-btn { background: #2b5278; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .call-btn:active { background: #3a6a99; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 9px 12px; border-radius: 14px; font-size: 15px; word-wrap: break-word; position: relative; }
  .msg.incoming { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.outgoing { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .time { font-size: 10px; color: rgba(255,255,255,0.5); margin-left: 6px; float: right; margin-top: 5px; }.input-area { padding: 10px; background: #17212b; display: flex; gap: 8px; border-top: 1px solid #0e1621; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .input-area input { flex: 1; background: #242f3d; border: none; border-radius: 20px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
  .input-area button { width: 44px; height: 44px; border-radius: 50%; background: #2b5278; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  
  /* Модалка звонка */
  #callScreen { display: none; position: fixed; inset: 0; background: rgba(14, 22, 33, 0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  #callScreen h2 { font-size: 24px; margin-bottom: 10px; }
  #callScreen p { color: #8a9aa9; margin-bottom: 30px; }
  .call-actions { display: flex; gap: 20px; margin-top: 20px; }
  .call-action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .accept { background: #4dcd5e; }
  .decline { background: #e74c3c; }
  
  #errorLog { position: fixed; bottom: 0; left: 0; right: 0; background: #ff0000; color: white; padding: 5px; font-size: 10px; display: none; z-index: 9999; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Vegram</h1>
  <input type="text" id="nameInput" placeholder="Твое имя" maxlength="20">
  <button onclick="login()">Войти в сеть</button>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="header">
      <div>
        <div class="name" id="myNameDisplay">Имя</div>
        <div style="font-size:12px; color:#4dcd5e;">● В сети</div>
      </div>
      <button class="logout-btn" onclick="location.reload()">Выйти</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="back-btn" onclick="closeChat()">‹</button>
        <div class="avatar" id="headerAvatar">👤</div>
        <div class="title" id="headerTitle">Имя</div>
      </div>
      <button class="call-btn" onclick="startCall()">📞</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<!-- Экран звонка -->
<div id="callScreen">
  <h2 id="callTitle">Звонок...</h2>
  <p id="callStatus">Подключение...</p>
  <div class="call-actions" id="callActions" style="display: none;">
    <button class="call-action-btn accept" onclick="acceptCall()">✅</button>
    <button class="call-action-btn decline" onclick="declineCall()">❌</button>
  </div>
  <div class="call-actions" id="hangupAction" style="display: none;">
    <button class="call-action-btn decline" onclick="endCall()">📞</button>
  </div>
</div>

<div id="errorLog"></div>

<!-- PeerJS для звонков -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<!-- Firebase (версия 8, работает везде) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // Регистрация Service Worker (чтобы PWABuilder увидел приложение)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
  }

  const firebaseConfig = {
    apiKey: "AIzaSyAjYs3IKjGw-FgVqP0K3DU4dgSKJU6pCc",
    authDomain: "vegram-ce8b1.firebaseapp.com",
    databaseURL: "https://vegram-ce8b1-default-rtdb.firebaseio.com",
    projectId: "vegram-ce8b1",
    storageBucket: "vegram-ce8b1.firebasestorage.app",
    messagingSenderId: "588021496755",
    appId: "1:588021496755:web:3f6d3922f5f646e668edc6"
  };firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let myName = "";
  let myUid = ""; 
  let activeChatUid = null;
  let messagesUnsubscribe = null;

  let peer = null;
  let currentCall = null;
  let localStream = null;

  function showError(msg) {
    const el = document.getElementById('errorLog');
    el.style.display = 'block';
    el.textContent = "ОШИБКА: " + msg;
    setTimeout(() => el.style.display = 'none', 5000);
  }

  window.login = () => {
    myName = document.getElementById('nameInput').value.trim();
    if (!myName) return alert("Введите имя!");
    
    myUid = localStorage.getItem('veg_uid') || (myName + "_" + Math.random().toString(36).substr(2, 5));
    localStorage.setItem('veg_uid', myUid);

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('myNameDisplay').textContent = myName;

    db.ref(`users/${myUid}`).set({ name: myName }).catch(e => showError("Ошибка входа: " + e.message));
    
    loadContacts();
    initPeer();
  };

  window.closeChat = () => {
    document.getElementById('app').classList.remove('chat-open');
    activeChatUid = null;
    if (messagesUnsubscribe) messagesUnsubscribe();
  };

  window.sendMessage = () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeChatUid) return;

    input.value = '';
    const chatId = [myUid, activeChatUid].sort().join('_');
    
    db.ref(`messages/${chatId}`).push({
      sender: myUid,
      text: text,
      time: Date.now()
    }).catch(e => showError("Ошибка отправки: " + e.message));
  };

  function loadContacts() {
    db.ref('users').on('value', (snapshot) => {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      const users = snapshot.val();
      if (!users) return;

      for (const uid in users) {
        if (uid === myUid) continue; 
        
        const u = users[uid];
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.innerHTML = `
          <div class="avatar">👤</div>
          <div class="chat-info">
            <div class="name">${u.name}</div>
          </div>
        `;
        div.onclick = () => openChat(uid, u.name);
        list.appendChild(div);
      }
    });
  }

  function openChat(uid, name) {
    activeChatUid = uid;
    document.getElementById('app').classList.add('chat-open');
    document.getElementById('headerTitle').textContent = name;

    const chatId = [myUid, activeChatUid].sort().join('_');
    const msgsRef = db.ref(`messages/${chatId}`).orderByChild('time');

    if (messagesUnsubscribe) messagesUnsubscribe();
    
    messagesUnsubscribe = msgsRef.on('value', (snapshot) => {
      const msgsEl = document.getElementById('messages');
      msgsEl.innerHTML = '';
      const data = snapshot.val();
      
      if (!data) {
        msgsEl.innerHTML = '<div style="text-align:center; font-size:12px; color:#666;">Сообщений нет...</div>';
        return;
      }

      Object.values(data).forEach(m => {
        const isMine = m.sender === myUid;
        const div = document.createElement('div');
        div.className = `msg ${isMine ? 'outgoing' : 'incoming'}`;
        const time = m.time ? new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
        div.innerHTML = `${m.text} <span class="time">${time}</span>`;
        msgsEl.appendChild(div);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  // ==========================================
  // ЛОГИКА ЗВОНКОВ
  // ==========================================
  function initPeer() {
    peer = new Peer(myUid);

    peer.on('open', (id) => {
      console.log('Готов к звонкам. Мой Peer ID:', id);
    });

    peer.on('call', (call) => {
      currentCall = call;
      document.getElementById('callScreen').style.display = 'flex';document.getElementById('callTitle').textContent = "Входящий звонок";
      document.getElementById('callStatus').textContent = "Нажмите, чтобы ответить";
      document.getElementById('callActions').style.display = 'flex';
    });

    peer.on('error', (err) => {
      showError("Ошибка звонка: " + err.message);
      closeCallScreen();
    });
  }

  window.startCall = async () => {
    if (!activeChatUid) return alert("Выберите контакт!");
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      document.getElementById('callScreen').style.display = 'flex';
      document.getElementById('callTitle').textContent = "Звонок...";
      document.getElementById('callStatus').textContent = "Ожидание ответа...";
      document.getElementById('hangupAction').style.display = 'flex';

      const call = peer.call(activeChatUid, localStream);
      
      if (!call) {
        showError("Не удалось позвонить (пользователь не в сети)");
        endCall();
        return;
      }

      currentCall = call;

      call.on('stream', (remoteStream) => {
        document.getElementById('callStatus').textContent = "Идет разговор...";
        const audio = new Audio();
        audio.srcObject = remoteStream;
        audio.play();
      });

      call.on('close', () => { endCall(); });

    } catch (err) {
      showError("Нет доступа к микрофону: " + err.message);
      closeCallScreen();
    }
  };

  window.acceptCall = async () => {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      document.getElementById('callActions').style.display = 'none';
      document.getElementById('hangupAction').style.display = 'flex';
      document.getElementById('callStatus').textContent = "Идет разговор...";

      currentCall.answer(localStream);
      
      currentCall.on('stream', (remoteStream) => {
        const audio = new Audio();
        audio.srcObject = remoteStream;
        audio.play();
      });

    } catch (err) {
      showError("Нет доступа к микрофону: " + err.message);
      declineCall();
    }
  };

  window.declineCall = () => {
    if (currentCall) currentCall.close();
    closeCallScreen();
  };

  window.endCall = () => {
    if (currentCall) currentCall.close();
    closeCallScreen();
  };

  function closeCallScreen() {
    document.getElementById('callScreen').style.display = 'none';
    document.getElementById('callActions').style.display = 'none';
    document.getElementById('hangupAction').style.display = 'none';
    
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    currentCall = null;
  }
</script>

</body>
</html>
