
<html la<!DOCTYPE ng="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vegram</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<style>
  :root { --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); --glass-bg: rgba(30, 41, 59, 0.7); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #6366f1; --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7); --msg-out: linear-gradient(135deg, #4f46e5, #7c3aed); --msg-in: rgba(255, 255, 255, 0.05); }
  [data-theme="light"] { --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%); --glass-bg: rgba(255, 255, 255, 0.8); --glass-border: rgba(0, 0, 0, 0.05); --text-main: #0f172a; --text-muted: #64748b; --accent: #4f46e5; --msg-out: linear-gradient(135deg, #4f46e5, #7c3aed); --msg-in: rgba(0, 0, 0, 0.05); }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; transition: background 0.3s, color 0.3s; }
  html, body { height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg-gradient); color: var(--text-main); }
  body::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%); }
  .glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }

  #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; z-index: 999; position: fixed; inset: 0; }
  .auth-card { padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
  .auth-card h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 30px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-form { display: flex; flex-direction: column; gap: 16px; }
  .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 15px; outline: none; }
  [data-theme="light"] .input-group input { background: #fff; }
  .input-group input:focus { border-color: var(--accent); }
  .auth-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--accent-gradient); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .auth-switch { margin-top: 20px; font-size: 14px; color: var(--text-muted); cursor: pointer; text-align: center; }
  .auth-switch span { color: var(--accent); font-weight: 600; }
  #errorMsg { color: #ef4444; font-size: 14px; text-align: center; margin-top: 15px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }

  .app { display: flex; height: 100%; width: 100%; position: relative; display: none; }
  .sidebar { width: 100%; height: 100%; display: flex; flex-direction: column; position: absolute; inset: 0; transition: transform 0.4s; z-index: 2; }
  .app.chat-open .sidebar { transform: translateX(-100%); }
  .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .header .name { font-size: 20px; font-weight: 700; }
  .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-main); font-size: 18px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  [data-theme="light"] .icon-btn { background: #fff; }.search-container { padding: 0 20px 10px 20px; border-bottom: 1px solid var(--glass-border); }
  .search-container input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 14px; outline: none; }
  [data-theme="light"] .search-container input { background: #fff; }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; cursor: pointer; margin-bottom: 5px; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  [data-theme="light"] .chat-item:hover { background: rgba(0,0,0,0.03); }
  
  .avatar { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--accent-gradient); color: #fff; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .chat-info { flex: 1; min-width: 0; }
  .chat-info .name { font-size: 16px; font-weight: 600; }
  .status.online { font-size: 13px; color: #4cd964; }
  
  .chat-area { width: 100%; height: 100%; display: flex; flex-direction: column; position: absolute; inset: 0; transform: translateX(100%); transition: transform 0.4s; z-index: 3; }
  .app.chat-open .chat-area { transform: translateX(0); }
  .chat-header { padding: 15px 20px; background: var(--glass-bg); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  [data-theme="light"] .back-btn { background: #fff; }
  .chat-header .avatar { width: 44px; height: 44px; font-size: 20px; }
  .chat-header .title { font-size: 18px; font-weight: 600; }
  
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
  .msg.incoming { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
  .msg.outgoing { background: var(--msg-out); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .time { font-size: 11px; color: rgba(255,255,255,0.6); margin-left: 8px; float: right; margin-top: 6px; }
  .msg.incoming .time { color: var(--text-muted); }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; cursor: pointer; }

  .input-area { padding: 15px 20px; background: var(--glass-bg); display: flex; gap: 12px; flex-shrink: 0; align-items: center; border-top: 1px solid var(--glass-border); }
  .input-area input[type="text"] { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 24px; padding: 14px 20px; color: var(--text-main); font-size: 15px; outline: none; }
  [data-theme="light"] .input-area input[type="text"] { background: #fff; }
  .input-area button.send { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gradient); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: var(--glass-bg); padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border); width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 20px; text-align: center; font-size: 20px; }.emoji-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .emoji-list span { font-size: 32px; cursor: pointer; text-align: center; padding: 8px; border-radius: 12px; }
  .emoji-list span:hover { background: rgba(255,255,255,0.1); }
  [data-theme="light"] .emoji-list span:hover { background: rgba(0,0,0,0.05); }
  
  .settings-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; transition: 0.2s; }
  [data-theme="light"] .settings-btn { background: #fff; }
  .settings-btn:hover { background: rgba(255,255,255,0.05); }
  .settings-btn.danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
  .settings-btn.danger:hover { background: rgba(239, 68, 68, 0.1); }
  
  .settings-section { margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 20px; }
  .settings-section h3 { font-size: 16px; margin-bottom: 12px; color: var(--text-muted); }
  
  .theme-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
  .theme-option { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); text-align: center; cursor: pointer; font-weight: 600; }
  .theme-option.active { background: var(--accent-gradient); color: #fff; border: none; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card glass">
    <h1>Vegram</h1>
    <div id="loginForm" class="auth-form">
      <div class="input-group"><input type="text" id="loginName" placeholder="Твое имя (Логин)"></div>
      <div class="input-group"><input type="password" id="loginPass" placeholder="Пароль"></div>
      <button class="auth-btn" onclick="login()">Войти</button>
      <div class="auth-switch" onclick="switchAuth('register')">Нет аккаунта? <span>Создать</span></div>
    </div>

    <div id="registerForm" class="auth-form" style="display: none;">
      <div class="input-group"><input type="text" id="regName" placeholder="Твое имя (Логин)"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Пароль"></div>
      <button class="auth-btn" onclick="register()">Создать аккаунт</button>
      <div class="auth-switch" onclick="switchAuth('login')">Уже есть аккаунт? <span>Войти</span></div>
    </div>
    <div id="errorMsg"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar glass">
    <div class="header">
      <div class="header-left" onclick="openProfileModal()">
        <div class="avatar" id="myAvatar" style="width: 44px; height: 44px; font-size: 20px;">👤</div>
        <div class="name" id="myNameDisplay">Имя</div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="icon-btn" onclick="openProfileModal()">⚙️</button>
      </div>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="filterContacts()">
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="chat-area glass">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹</button>
      <div class="avatar" id="headerAvatar">👤</div>
      <div class="title" id="headerTitle">Имя</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📎</button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
      <input type="text" id="msgInput" placeholder="Сообщение..." oninput="sendTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<div id="profileModal" class="modal"><div class="modal-content">
    <h2>Мой профиль</h2>
    
    <div class="settings-section" style="margin-top: 0; border: none; padding-top: 0;">
      <h3>Оформление</h3>
      <div class="theme-toggle">
        <div class="theme-option" id="themeDark" onclick="setTheme('dark')">🌙 Тёмная</div>
        <div class="theme-option" id="themeLight" onclick="setTheme('light')">☀️ Светлая</div>
      </div>
    </div>

    <div class="emoji-list" id="emojiList"></div>
    <button class="settings-btn" onclick="document.getElementById('avatarInput').click()">
      🖼️ Загрузить свое фото
    </button>
    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="uploadAvatar(event)">

    <div class="settings-section">
      <h3>Сменить имя</h3>
      <div class="input-group" style="margin-bottom: 10px;">
        <input type="text" id="newNameInput" placeholder="Новое имя">
      </div>
      <button class="settings-btn" onclick="changeName()">Сохранить имя</button>
    </div>

    <div class="settings-section">
      <h3>Сменить пароль</h3>
      <div class="input-group" style="margin-bottom: 10px;">
        <input type="password" id="newPassInput" placeholder="Новый пароль">
      </div>
      <button class="settings-btn" onclick="changePassword()">Сохранить пароль</button>
    </div>

    <div class="settings-section">
      <button class="settings-btn danger" onclick="logout()">Выйти из аккаунта</button>
    </div>
    
    <button class="settings-btn" style="margin-top: 20px; background: transparent; border: none; color: var(--text-muted);" onclick="closeProfileModal()">Закрыть</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(e => console.log(e)); }

  const firebaseConfig = {
    apiKey: "AIzaSyDBn-VsssJ6USgzhgPYcyJ4gqJ7NUTtH8U",
    authDomain: "vegram-48f56.firebaseapp.com",
    databaseURL: "https://vegram-48f56-default-rtdb.firebaseio.com",
    projectId: "vegram-48f56",
    storageBucket: "vegram-48f56.firebasestorage.app",
    messagingSenderId: "101363345016",
    appId: "1:101363345016:web:324e0fe29a83eef536ef8d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let myName = ""; let myUid = ""; let activeChatUid = null;
  let messagesUnsubscribe = null; let allUsersData = {};

  const currentTheme = localStorage.getItem('veg_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);

  window.setTheme = (theme) => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('veg_theme', theme);
    document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
    document.getElementById('themeLight').classList.toggle('active', theme === 'light');
  };

  function formatTime(ts) { return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }

  window.switchAuth = (type) => {
    document.getElementById('loginForm').style.display = type === 'login' ? 'flex' : 'none';
    document.getElementById('registerForm').style.display = type === 'register' ? 'flex' : 'none';
    document.getElementById('errorMsg').style.display = 'none';
  };
  function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }

  window.register = () => {
    const name = document.getElementById('regName').value.trim(); const pass = document.getElementById('regPass').value;
    if (!name || !pass) return showError("Заполните все поля!");
    if (pass.length < 4) return showError("Пароль минимум 4 символа!");

    db.ref(`users/${name}`).once('value').then((snap) => {
      if (snap.exists()) return showError("Это имя уже занято!");db.ref(`users/${name}`).set({ name: name, pass: pass, avatar: "👤", lastSeen: Date.now(), online: true });
      myName = name; myUid = name;
      startChat();
    });
  };

  window.login = () => {
    const name = document.getElementById('loginName').value.trim(); const pass = document.getElementById('loginPass').value;
    if (!name || !pass) return showError("Заполните все поля!");

    db.ref(`users/${name}`).once('value').then((snap) => {
      const data = snap.val();
      if (!data) return showError("Пользователь не найден!");
      if (data.pass !== pass) return showError("Неверный пароль!");
      
      myName = name; myUid = name;
      startChat();
    });
  };

  function startChat() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('myNameDisplay').textContent = myName;
    
    db.ref(`users/${myUid}`).once('value').then((snap) => {
      const u = snap.val();
      if (u && u.avatar) {
        document.getElementById('myAvatar').innerHTML = u.avatar.startsWith('data:image') ? `<img src="${u.avatar}">` : u.avatar;
      }
    });

    db.ref(`users/${myUid}`).update({ online: true, lastSeen: Date.now() });
    db.ref(`users/${myUid}`).onDisconnect().update({ online: false, lastSeen: Date.now() });
    
    loadContacts();
  }

  window.logout = () => {
    if (myUid) db.ref(`users/${myUid}`).update({ lastSeen: Date.now(), online: false });
    location.reload();
  };

  window.closeChat = () => {
    document.getElementById('app').classList.remove('chat-open');
    activeChatUid = null;
    if (messagesUnsubscribe) messagesUnsubscribe();
  };

  window.sendMessage = () => {
    const input = document.getElementById('msgInput'); const text = input.value.trim();
    if (!text || !activeChatUid) return;
    input.value = '';
    const chatId = [myUid, activeChatUid].sort().join('_');
    db.ref(`messages/${chatId}`).push({ sender: myUid, text: text, time: Date.now(), type: 'text' });
  };

  window.sendImage = (event) => {
    const file = event.target.files[0]; if (!file || !activeChatUid) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const chatId = [myUid, activeChatUid].sort().join('_');
      db.ref(`messages/${chatId}`).push({ sender: myUid, image: e.target.result, time: Date.now(), type: 'image' });
    };
    reader.readAsDataURL(file); event.target.value = '';
  };

  let typingTimeout;
  window.sendTyping = () => {
    if (!activeChatUid) return;
    const chatId = [myUid, activeChatUid].sort().join('_');
    db.ref(`typing/${chatId}`).set({ [myUid]: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { db.ref(`typing/${chatId}/${myUid}`).remove(); }, 1500);
  };

  function loadContacts() {
    db.ref('users').on('value', (snapshot) => {
      allUsersData = snapshot.val() || {};
      filterContacts();
    });
  }

  window.filterContacts = () => {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('chatList'); 
    list.innerHTML = '';
    if (!allUsersData) return;

    for (const uid in allUsersData) {
      if (uid === myUid) continue; 
      const u = allUsersData[uid];
      if (!u.online) continue; 
      if (u.name.toLowerCase().includes(query)) {
        const div = document.createElement('div'); 
        div.className = 'chat-item';
        
        let avatarHtml = u.avatar || '👤';
        if (avatarHtml.startsWith('data:image')) avatarHtml = `<img src="${avatarHtml}">`;

        div.innerHTML = `
          <div class="avatar">${avatarHtml}</div>
          <div class="chat-info">
            <div class="name">${u.name}</div>
            <div class="status online">● В сети</div>
          </div>
        `;
        div.onclick = () => openChat(uid, u.name, avatarHtml);
        list.appendChild(div);
      }
    }
    if (list.innerHTML === '') {list.innerHTML = '<div style="text-align:center; font-size:13px; color:#666; margin-top:20px;">Никого не найдено...</div>';
    }
  };

  function openChat(uid, name, avatarHtml) {
    activeChatUid = uid;
    document.getElementById('app').classList.add('chat-open');
    document.getElementById('headerTitle').textContent = name;
    document.getElementById('headerAvatar').innerHTML = avatarHtml;
    const chatId = [myUid, activeChatUid].sort().join('_');
    const msgsRef = db.ref(`messages/${chatId}`).orderByChild('time');
    if (messagesUnsubscribe) messagesUnsubscribe();
    
    messagesUnsubscribe = msgsRef.on('value', (snapshot) => {
      const msgsEl = document.getElementById('messages'); msgsEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) { msgsEl.innerHTML = '<div style="text-align:center; font-size:13px; color:#666; margin-top:20px;">Сообщений нет...</div>'; return; }
      Object.keys(data).forEach(key => {
        const m = data[key]; const isMine = m.sender === myUid;
        const div = document.createElement('div'); div.className = `msg ${isMine ? 'outgoing' : 'incoming'}`; div.dataset.id = key;
        const time = m.time ? formatTime(m.time) : '';
        if (m.type === 'image') { div.innerHTML = `<img src="${m.image}"> <span class="time">${time}</span>`; }
        else { div.innerHTML = `${m.text} <span class="time">${time}</span>`; }
        msgsEl.appendChild(div);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  const avatars = ['👤','😎','🤖','🦊','🐱','🐶','🐼','🦁','🐸','👽','👻','💩','🎃','🤡','🥷','👨‍💻','👩‍💻','🧑‍🚀'];
  const emojiList = document.getElementById('emojiList');
  emojiList.innerHTML = avatars.map(e => `<span onclick="setAvatar('${e}')">${e}</span>`).join('');

  window.openProfileModal = () => {
    document.getElementById('profileModal').style.display = 'flex';
    document.getElementById('newNameInput').value = myName;
    setTheme(localStorage.getItem('veg_theme') || 'dark');
  };
  window.closeProfileModal = () => document.getElementById('profileModal').style.display = 'none';

  window.setAvatar = (emoji) => {
    document.getElementById('myAvatar').innerHTML = emoji;
    db.ref(`users/${myUid}/avatar`).set(emoji);
    if (allUsersData[myUid]) allUsersData[myUid].avatar = emoji;
  };

  window.uploadAvatar = (event) => {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const base64 = e.target.result;
      document.getElementById('myAvatar').innerHTML = `<img src="${base64}">`;
      db.ref(`users/${myUid}/avatar`).set(base64);
      if (allUsersData[myUid]) allUsersData[myUid].avatar = base64;
    };
    reader.readAsDataURL(file); event.target.value = '';
  };

  window.changeName = () => {
    const newName = document.getElementById('newNameInput').value.trim();
    if (!newName) return alert("Введите новое имя!");
    if (newName === myName) return alert("Это твое текущее имя!");

    db.ref(`users/${newName}`).once('value').then((snap) => {
      if (snap.exists()) return alert("Это имя уже занято!");
      
      db.ref(`users/${myUid}`).once('value').then((userSnap) => {
        const userData = userSnap.val();
        userData.name = newName;
        
        db.ref(`users/${newName}`).set(userData).then(() => {
          db.ref(`users/${myUid}`).remove();
          myName = newName;
          myUid = newName;
          document.getElementById('myNameDisplay').textContent = myName;
          alert("Имя успешно изменено!");
          closeProfileModal();
        });
      });
    });
  };

  window.changePassword = () => {
    const newPass = document.getElementById('newPassInput').value;
    if (!newPass || newPass.length < 4) return alert("Пароль минимум 4 символа!");
    
    db.ref(`users/${myUid}/pass`).set(newPass).then(() => {
      alert("Пароль успешно изменен!");
      document.getElementById('newPassInput').value = '';
    });
  };</script>
</body>
</html>
