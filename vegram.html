<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vegram Premium</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --glass-bg: rgba(30, 41, 59, 0.7);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
    --msg-out: linear-gradient(135deg, #4f46e5, #7c3aed);
    --msg-in: rgba(255, 255, 255, 0.05);
  }
  [data-theme="light"] {
    --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
    --glass-bg: rgba(255, 255, 255, 0.8);
    --glass-border: rgba(0, 0, 0, 0.05);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #4f46e5;
    --msg-out: linear-gradient(135deg, #4f46e5, #7c3aed);
    --msg-in: rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background 0.3s, color 0.3s; }
  html, body { height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg-gradient); color: var(--text-main); }
  
  body::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
  }

  .glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }

  #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; z-index: 999; position: fixed; inset: 0; }
  .auth-card { padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  
  .auth-card h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 30px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-form { display: flex; flex-direction: column; gap: 16px; }
  .input-group { position: relative; }
  .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 15px; outline: none; transition: 0.2s; }
  [data-theme="light"] .input-group input { background: #fff; }
  .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
  .auth-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--accent-gradient); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.6); transition: 0.3s; }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -6px rgba(99, 102, 241, 0.8); }

  .app { display: flex; height: 100%; width: 100%; position: relative; display: none; }
  .sidebar { width: 100%; height: 100%; display: flex; flex-direction: column; position: absolute; inset: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2; }
  .app.chat-open .sidebar { transform: translateX(-100%); }
  
  .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .header .name { font-size: 20px; font-weight: 700; color: var(--text-main); }.icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-main); font-size: 18px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .logout-btn { background: none; border: none; color: #ef4444; font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 8px; }
  
  .search-container { padding: 0 20px 10px 20px; border-bottom: 1px solid var(--glass-border); }
  .search-container input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 14px; outline: none; }
  [data-theme="light"] .search-container input { background: #fff; }

  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  
  .avatar { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--accent-gradient); color: #fff; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-info .name { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
  .chat-info .status { font-size: 13px; color: var(--text-muted); }
  .status.online { color: #4cd964; }

  .chat-area { width: 100%; height: 100%; display: flex; flex-direction: column; position: absolute; inset: 0; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 3; }
  .app.chat-open .chat-area { transform: translateX(0); }
  
  .chat-header { padding: 15px 20px; background: var(--glass-bg); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .chat-header .avatar { width: 44px; height: 44px; font-size: 20px; }
  .chat-header .title { font-size: 18px; font-weight: 600; color: var(--text-main); }
  
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; user-select: none; animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .msg.incoming { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
  .msg.outgoing { background: var(--msg-out); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .time { font-size: 11px; color: rgba(255,255,255,0.6); margin-left: 8px; float: right; margin-top: 6px; }
  .msg.incoming .time { color: var(--text-muted); }
  .msg img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  
  .input-area { padding: 15px 20px; padding-bottom: max(15px, env(safe-area-inset-bottom)); background: var(--glass-bg); display: flex; gap: 12px; flex-shrink: 0; align-items: center; border-top: 1px solid var(--glass-border); }
  .input-area input[type="text"] { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 24px; padding: 14px 20px; color: var(--text-main); font-size: 15px; outline: none; }
  [data-theme="light"] .input-area input[type="text"] { background: #fff; }.input-area button.send { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gradient); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
  .modal-content { background: var(--glass-bg); padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border); width: 90%; max-width: 400px; }
  .modal h2 { margin-bottom: 20px; color: var(--text-main); text-align: center; font-size: 20px; }
  .emoji-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .emoji-list span { font-size: 32px; cursor: pointer; text-align: center; padding: 8px; border-radius: 12px; }
  .emoji-list span:hover { background: rgba(255,255,255,0.1); }
  
  #contextMenu { display: none; position: fixed; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 6px; z-index: 2000; }
  #contextMenu button { background: #ef4444; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card glass">
    <h1>Vegram</h1>
    <div class="auth-form">
      <div class="input-group"><input type="text" id="nameInput" placeholder="Твое имя" maxlength="20"></div>
      <button class="auth-btn" onclick="login()">Войти в сеть</button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar glass">
    <div class="header">
      <div class="header-left" onclick="openAvatarModal()">
        <div class="avatar" id="myAvatar" style="width: 44px; height: 44px; font-size: 20px;">👤</div>
        <div class="name" id="myNameDisplay">Имя</div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="icon-btn" onclick="toggleTheme()">🌓</button>
        <button class="logout-btn" onclick="logout()">Выйти</button>
      </div>
    </div>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="filterContacts()">
    </div>

    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="chat-area glass">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹</button>
      <div class="avatar" id="headerAvatar">👤</div>
      <div class="title" id="headerTitle">Имя</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📎</button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
      <input type="text" id="msgInput" placeholder="Сообщение..." oninput="sendTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<div id="avatarModal" class="modal">
  <div class="modal-content">
    <h2>Выбери аватарку</h2>
    <div class="emoji-list" id="emojiList"></div>
  </div>
</div>

<div id="contextMenu">
  <button onclick="deleteSelectedMsg()">🗑️ Удалить</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(e => console.log(e)); }

  const firebaseConfig = {
    apiKey: "AIzaSyDBn-VsssJ6USgzhgPYcyJ4gqJ7NUTtH8U",
    authDomain: "vegram-48f56.firebaseapp.com",
    databaseURL: "https://vegram-48f56-default-rtdb.firebaseio.com",
    projectId: "vegram-48f56",
    storageBucket: "vegram-48f56.firebasestorage.app",messagingSenderId: "101363345016",
    appId: "1:101363345016:web:324e0fe29a83eef536ef8d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let myName = ""; let myUid = ""; let activeChatUid = null;
  let messagesUnsubscribe = null; let selectedMsgId = null; let longPressTimer;
  let allUsersData = {};

  const currentTheme = localStorage.getItem('veg_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);

  window.toggleTheme = () => {
    const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('veg_theme', newTheme);
  };

  function formatTime(ts) { return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }
  function formatLastSeen(ts) {
    const d = new Date(ts); const now = new Date();
    if (d.toDateString() === now.toDateString()) return "был(а) сегодня в " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    return "был(а) " + d.toLocaleDateString();
  }

  window.login = () => {
    myName = document.getElementById('nameInput').value.trim();
    if (!myName) return alert("Введите имя!");
    
    myUid = myName + "_" + Math.random().toString(36).substr(2, 5);

    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('myNameDisplay').textContent = myName;

    db.ref(`users/${myUid}`).set({ name: myName, avatar: "👤", lastSeen: Date.now(), online: true });
    db.ref(`users/${myUid}`).onDisconnect().update({ online: false, lastSeen: Date.now() });
    
    loadContacts();
  };

  window.logout = () => {
    if (myUid) db.ref(`users/${myUid}`).update({ lastSeen: Date.now(), online: false });
    location.reload();
  };

  window.closeChat = () => {
    document.getElementById('app').classList.remove('chat-open');
    activeChatUid = null;
    if (messagesUnsubscribe) messagesUnsubscribe();
  };

  window.sendMessage = () => {
    const input = document.getElementById('msgInput'); const text = input.value.trim();
    if (!text || !activeChatUid) return;
    input.value = '';
    const chatId = [myUid, activeChatUid].sort().join('_');
    db.ref(`messages/${chatId}`).push({ sender: myUid, text: text, time: Date.now(), type: 'text' });
  };

  window.sendImage = (event) => {
    const file = event.target.files[0]; if (!file || !activeChatUid) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const chatId = [myUid, activeChatUid].sort().join('_');
      db.ref(`messages/${chatId}`).push({ sender: myUid, image: e.target.result, time: Date.now(), type: 'image' });
    };
    reader.readAsDataURL(file); event.target.value = '';
  };

  let typingTimeout;
  window.sendTyping = () => {
    if (!activeChatUid) return;
    const chatId = [myUid, activeChatUid].sort().join('_');
    db.ref(`typing/${chatId}`).set({ [myUid]: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { db.ref(`typing/${chatId}/${myUid}`).remove(); }, 1500);
  };

  function loadContacts() {
    db.ref('users').on('value', (snapshot) => {
      allUsersData = snapshot.val() || {};
      filterContacts();
    });
  }

  window.filterContacts = () => {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('chatList'); 
    list.innerHTML = '';
    
    if (!allUsersData) return;

    for (const uid in allUsersData) {
      if (uid === myUid) continue; 
      
      const u = allUsersData[uid];
      
      if (!u.online) continue; 

      if (u.name.toLowerCase().includes(query)) {
        const div = document.createElement('div'); 
        div.className = 'chat-item';
        div.innerHTML = `
          <div class="avatar">${u.avatar || '👤'}</div>
          <div class="chat-info"><div class="name">${u.name}</div>
            <div class="status online">● В сети</div>
          </div>
        `;
        div.onclick = () => openChat(uid, u.name, u.avatar || '👤');
        list.appendChild(div);
      }
    }
    
    if (list.innerHTML === '') {
      list.innerHTML = '<div style="text-align:center; font-size:13px; color:#666; margin-top:20px;">Никого не найдено...</div>';
    }
  };

  function openChat(uid, name, avatar) {
    activeChatUid = uid;
    document.getElementById('app').classList.add('chat-open');
    document.getElementById('headerTitle').textContent = name;
    document.getElementById('headerAvatar').textContent = avatar;
    const chatId = [myUid, activeChatUid].sort().join('_');
    const msgsRef = db.ref(`messages/${chatId}`).orderByChild('time');
    if (messagesUnsubscribe) messagesUnsubscribe();
    
    messagesUnsubscribe = msgsRef.on('value', (snapshot) => {
      const msgsEl = document.getElementById('messages'); msgsEl.innerHTML = '';
      const data = snapshot.val();
      if (!data) { msgsEl.innerHTML = '<div style="text-align:center; font-size:13px; color:#666; margin-top:20px;">Сообщений нет...</div>'; return; }
      Object.keys(data).forEach(key => {
        const m = data[key]; const isMine = m.sender === myUid;
        const div = document.createElement('div'); div.className = `msg ${isMine ? 'outgoing' : 'incoming'}`; div.dataset.id = key;
        const time = m.time ? formatTime(m.time) : '';
        if (m.type === 'image') { div.innerHTML = `<img src="${m.image}"> <span class="time">${time}</span>`; }
        else { div.innerHTML = `${m.text} <span class="time">${time}</span>`; }
        
        if (isMine) {
          div.onmousedown = (e) => { longPressTimer = setTimeout(() => showContextMenu(e.clientX, e.clientY, key), 600); };
          div.onmouseup = () => clearTimeout(longPressTimer); div.onmouseleave = () => clearTimeout(longPressTimer);
          div.ontouchstart = (e) => { const t = e.touches[0]; longPressTimer = setTimeout(() => showContextMenu(t.clientX, t.clientY, key), 600); };
          div.ontouchend = () => clearTimeout(longPressTimer); div.ontouchmove = () => clearTimeout(longPressTimer);
        }
        msgsEl.appendChild(div);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  function showContextMenu(x, y, msgId) {
    selectedMsgId = msgId;
    const menu = document.getElementById('contextMenu');
    menu.style.display = 'block'; menu.style.left = x + 'px'; menu.style.top = y + 'px';
  }

  window.deleteSelectedMsg = () => {
    if (!selectedMsgId || !activeChatUid) return;
    const chatId = [myUid, activeChatUid].sort().join('_');
    db.ref(`messages/${chatId}/${selectedMsgId}`).remove();
    document.getElementById('contextMenu').style.display = 'none'; selectedMsgId = null;
  };

  document.addEventListener('click', (e) => {
    if (!document.getElementById('contextMenu').contains(e.target)) document.getElementById('contextMenu').style.display = 'none';
  });

  const avatars = ['👤','😎','🤖','🦊','🐱','🐶','🐼','🦁','🐸','👽','👻','💩','🎃','🤡','🥷','👨‍💻','👩‍💻','🧑‍🚀'];
  const emojiList = document.getElementById('emojiList');
  emojiList.innerHTML = avatars.map(e => `<span onclick="setAvatar('${e}')">${e}</span>`).join('');

  window.openAvatarModal = () => document.getElementById('avatarModal').style.display = 'flex';
  window.setAvatar = (emoji) => {
    document.getElementById('myAvatar').textContent = emoji;
    db.ref(`users/${myUid}/avatar`).set(emoji);
    document.getElementById('avatarModal').style.display = 'none';
  };
  document.getElementById('avatarModal').onclick = (e) => {
    if (e.target.id === 'avatarModal' || e.target.className === 'modal-content') document.getElementById('avatarModal').style.display = 'none';
  };
</script>
</body>
</html>
